name: Test & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Probe UI gate (watch paths vs merge-base)
        id: ui_gate
        shell: bash
        run: |
          # --check exits 1 when triggered && no valid .ui-gate/result.json yet; still emit JSON for the probe.
          set +e
          json=$(node tools/ui-gate-run.mjs --check --json)
          probe_ec=$?
          set -e
          echo "$json"
          node -e "JSON.parse(process.argv[1])" "$json" || exit "${probe_ec:-1}"
          triggered=$(node -e "const j=JSON.parse(process.argv[1]); process.stdout.write(j.triggered?'true':'false')" "$json")
          echo "triggered=$triggered" >> "$GITHUB_OUTPUT"

      - name: Install Playwright Chromium for UI gate
        if: steps.ui_gate.outputs.triggered == 'true'
        run: npx playwright install chromium

      - name: Run Web UI gate when watch paths changed
        if: steps.ui_gate.outputs.triggered == 'true'
        run: npm run verify:ui

      - name: Run release check including unit & integration tests
        run: npm run release-check

      - name: Calibrate statistical rules with full stable-process simulations
        run: npm run test:slow

      - name: Build Cloudflare assets
        run: npm run build:cloudflare

      - name: Validate Cloudflare Worker configuration & dry-run
        run: npx wrangler deploy --dry-run
